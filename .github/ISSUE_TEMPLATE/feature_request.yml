name: Feature request
description: An idea for the game, a world, the remote, or hosting it.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and what would it be like to play?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve, or what moment does it make better?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A sport's gameplay
        - A new world
        - The phone remote
        - Menus / UI
        - Online play
        - Running or hosting it
        - Other
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself (see CONTRIBUTING.md and docs/)
