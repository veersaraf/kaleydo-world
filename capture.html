<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#16162a" />
    <link rel="icon" href="/favicon.svg" />
    <title>KALEIDO Motion Capture</title>
    <style>
      /* A plain tool page: the motion recorder (src/pad/capture-page.ts). */
      :root {
        color-scheme: dark;
        --bg: #16162a;
        --card: #232342;
        --ink: #f3f1ff;
        --dim: #a9a6c9;
        --acc: #8a7dff;
        --good: #5fd39a;
        --warn: #ffb44d;
        --bad: #ff6b7a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.4 -apple-system, system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #app {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--dim);
      }
      .rec {
        color: var(--bad);
        font-weight: 700;
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        padding: 16px;
      }
      .step-n {
        font-size: 13px;
        color: var(--dim);
      }
      h1 {
        margin: 4px 0 8px;
        font-size: 26px;
      }
      p {
        margin: 0;
        color: var(--dim);
      }
      button {
        font: inherit;
        font-weight: 700;
        color: var(--ink);
        background: var(--acc);
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        touch-action: manipulation;
      }
      button.ghost {
        background: transparent;
        border: 2px solid #44446a;
        color: var(--dim);
      }
      button:disabled {
        opacity: 0.4;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > button {
        flex: 1;
      }
      .live {
        min-height: 3.2em;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
      }
      .live.near {
        color: var(--warn);
      }
      .live.guarded {
        color: var(--dim);
      }
      .log {
        font: 14px/1.5 ui-monospace, Menlo, monospace;
        color: var(--dim);
        min-height: 3em;
        word-break: break-word;
      }
      .meter {
        height: 8px;
        border-radius: 4px;
        background: #33335a;
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--good);
      }
      .guard {
        margin-top: auto;
        height: 150px;
        border-radius: 20px;
        background: #33335a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.08em;
        touch-action: none;
      }
      .guard.held {
        background: var(--acc);
      }
      .status {
        font-size: 12px;
        color: var(--dim);
        text-align: center;
      }
      .status.bad {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pad/capture-page.ts"></script>
  </body>
</html>
