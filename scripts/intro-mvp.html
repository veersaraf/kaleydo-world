<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kaleydo World · intro motion</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3f86; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, #3cc0f2 0%, #1f93dc 35%, #0b3f86 100%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  svg#words { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .l { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 700; fill: #fff; stroke: #1d1c33; paint-order: stroke fill; stroke-linejoin: round; }
  .s { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 700; fill: #1d1c33; stroke: #1d1c33; stroke-linejoin: round; }
  #ui { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
        background: rgba(10, 16, 50, 0.72); color: #dff1ff; padding: 8px 14px; border-radius: 999px; font-size: 13px; }
  #ui button { background: #fff; color: #1d1c33; border: 0; border-radius: 999px; padding: 5px 12px; font-weight: 700; cursor: pointer; }
  #ui input[type=range] { width: 220px; }
  #ui label { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><svg id="words"></svg></div>
<div id="ui">
  <button id="play">Replay</button>
  <label>time <input id="scrub" type="range" min="0" max="5" step="0.01" value="0" /><span id="tv">0.00s</span></label>
  <label>speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option></select></label>
</div>
<script type="module">
// Motion prototype for the KALEYDO WORLD intro (placeholder low-poly globe, real lettering).
// Timeline (seconds): 0–0.9 the big globe slides in from the right, partly off screen, turning;
// 1.0–2.75 one complete eased revolution while it shrinks and glides to centre (1.15–2.65);
// 2.1–3.2 KALEYDO drops in letter by letter over the top, WORLD rises in under it; then an idle loop.
import '@fontsource/fredoka/700.css';
import * as THREE from 'three';

// ---------------------------------------------------------------- easing
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = (x) => 1 - (1 - x) ** 3;
const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const easeOutBack = (x, k = 1.6) => 1 + (k + 1) * (x - 1) ** 3 + k * (x - 1) ** 2;
/** a damped spring from 0 → 1 */
const spring = (x, w = 13, z = 0.42) => (x <= 0 ? 0 : 1 - Math.exp(-z * w * x) * Math.cos(w * Math.sqrt(1 - z * z) * x));
const lerp = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- the placeholder globe
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
// orthographic: 1 unit = half the viewport height, so sizes read as fractions of the screen
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 20);
cam.position.set(0, 0, 10);

const islands = [
  { d: [0.1, 0.17, 0.98], c: '#86cf3c' },   // tennis
  { d: [0.85, 0.5, 0.2], c: '#e6a13a' },    // baseball (autumn)
  { d: [0.52, -0.41, -0.75], c: '#f3c776' },// bowling (desert)
  { d: [-0.5, 0.47, -0.73], c: '#3f9a3a' }, // archery (forest)
  { d: [-0.87, -0.44, 0.22], c: '#f4f8ff' },// duel (snow)
].map((i) => ({ d: new THREE.Vector3(...i.d).normalize(), c: new THREE.Color(i.c) }));
const geo = new THREE.IcosahedronGeometry(1, 4).toNonIndexed();
const pos = geo.attributes.position;
const cols = new Float32Array(pos.count * 3);
const ocean = new THREE.Color('#2b8df0'), shelf = new THREE.Color('#5fd6ff'), sand = new THREE.Color('#f4cf86');
const v = new THREE.Vector3(), c = new THREE.Color();
for (let f = 0; f < pos.count; f += 3) {
  v.set(0, 0, 0);
  for (let k = 0; k < 3; k++) v.add(new THREE.Vector3().fromBufferAttribute(pos, f + k));
  v.normalize();
  let best = 9, bi = 0;
  islands.forEach((is, i) => { const a = v.angleTo(is.d); if (a < best) { best = a; bi = i; } });
  const wob = Math.sin(v.x * 9) * Math.cos(v.y * 7) * 0.05;
  if (best + wob < 0.42) c.copy(islands[bi].c);
  else if (best + wob < 0.47) c.copy(sand);
  else if (best + wob < 0.58) c.copy(shelf);
  else c.copy(ocean).multiplyScalar(0.92 + ((f * 7919) % 13) / 100);
  for (let k = 0; k < 3; k++) cols.set([c.r, c.g, c.b], (f + k) * 3);
}
geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
geo.computeVertexNormals();
const globe = new THREE.Group();
const tilt = new THREE.Group();
tilt.rotation.set(0.28, 0, 0.18);
const planet = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.6 }));
tilt.add(planet);
globe.add(tilt);
// a lime moon on a tilted orbit
const moonPivot = new THREE.Group();
moonPivot.rotation.set(0.3, 0, 0.35);
const moon = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 2), new THREE.MeshStandardMaterial({ color: '#d8ff3a', flatShading: true, roughness: 0.7 }));
moon.position.x = 1.45;
moonPivot.add(moon);
globe.add(moonPivot);
// a soft rim glow
const glow = new THREE.Mesh(new THREE.CircleGeometry(1.1, 64), new THREE.MeshBasicMaterial({ color: '#9fe9ff', transparent: true, opacity: 0.18 }));
glow.position.z = -2;
globe.add(glow);
scene.add(globe);
scene.add(new THREE.HemisphereLight('#e6f6ff', '#ff9fc6', 1.1));
const key = new THREE.DirectionalLight('#fff1dc', 2.4);
key.position.set(-4, 3, 5);
scene.add(key);

// ---------------------------------------------------------------- lettering on arcs
const svg = document.getElementById('words');
const NS = 'http://www.w3.org/2000/svg';
function word(text, cls) {
  return [...text].map((ch) => {
    const g = document.createElementNS(NS, 'g');
    const sh = document.createElementNS(NS, 'text');
    const tx = document.createElementNS(NS, 'text');
    for (const t of [sh, tx]) { t.textContent = ch; t.setAttribute('text-anchor', 'middle'); }
    sh.setAttribute('class', 's');
    tx.setAttribute('class', 'l');
    g.append(sh, tx);
    svg.append(g);
    return { ch, g, sh, tx, w: 0 };
  });
}
const TOP = word('KALEYDO'), BOT = word('WORLD');

/** measure each letter's advance at a given font size */
function measure(letters, size) {
  for (const L of letters) {
    L.tx.setAttribute('font-size', size);
    L.w = L.tx.getComputedTextLength() || size * 0.6;
  }
}

// final lockup (in half-viewport-height units): globe radius and centre
const END = { r: 0.46, x: 0, y: -0.06 };

/**
 * Lay a word on a gentle arc. arch = +1: an arch whose apex (the word's middle baseline) sits at apexY;
 * -1: a smile whose lowest point sits at apexY. sweep = the arc's total angle in degrees (small = subtle).
 */
function layout(letters, size, sweep, cx, apexY, arch, track, progress, from) {
  measure(letters, size);
  const total = letters.reduce((a, L) => a + L.w, 0) + track * size * (letters.length - 1);
  const radius = total / ((sweep * Math.PI) / 180);
  const cy = apexY + arch * radius;
  let s = -total / 2;
  letters.forEach((L, i) => {
    const mid = s + L.w / 2;
    s += L.w + track * size;
    const ang = mid / radius; // radians along the arc
    const x = cx + Math.sin(ang) * radius;
    const y = cy - arch * Math.cos(ang) * radius; // svg y grows down
    const rot = arch * ang * (180 / Math.PI);
    // per-letter entrance: stagger across the word, spring in from `from` px along the radial direction
    const p = progress(i);
    const drop = (1 - p.pos) * from;
    // outward from the globe centre: up for the top word, down for the bottom one
    const dx = Math.sin(ang) * drop, dy = -arch * Math.cos(ang) * drop;
    const tr = `translate(${x + dx} ${y + dy}) rotate(${rot}) scale(${p.scale})`;
    L.g.setAttribute('transform', tr);
    L.g.style.opacity = p.op;
    L.tx.setAttribute('font-size', size);
    L.tx.setAttribute('stroke-width', size * 0.16);
    L.sh.setAttribute('font-size', size);
    L.sh.setAttribute('stroke-width', size * 0.16);
    L.sh.setAttribute('transform', `translate(0 ${size * 0.07})`);
  });
}

// ---------------------------------------------------------------- the timeline
const DUR = 5;
function frame(t) {
  const W = innerWidth, H = innerHeight, aspect = W / H;
  cam.left = -aspect; cam.right = aspect; cam.top = 1; cam.bottom = -1;
  cam.updateProjectionMatrix();
  // narrow windows: shrink everything so the lockup still fits the width
  const kf = Math.min(1, (aspect * 0.8) / 1.25);

  // 1) slide in big from the right, partly off screen
  const slide = easeOutCubic(seg(t, 0, 0.9));
  const big = { r: 1.35 * kf, x: aspect * 0.42, y: -0.18 };
  let r = big.r, x = lerp(aspect + big.r * 1.1, big.x, slide), y = big.y;
  // 3) shrink and glide to the centre
  const shrink = easeInOutCubic(seg(t, 1.15, 2.65));
  r = lerp(r, END.r * kf, shrink);
  x = lerp(x, END.x, shrink);
  y = lerp(y, END.y, shrink);
  // settle: a tiny overshoot in scale at the landing, then a gentle bob
  const land = seg(t, 2.45, 3.25);
  r *= 1 + Math.sin(land * Math.PI) * 0.025 * (1 - land);
  y += Math.sin(Math.max(0, t - 2.9) * 1.6) * 0.012 * seg(t, 2.9, 3.7);
  globe.position.set(x, y, 0);
  globe.scale.setScalar(r);

  // 2) spin: a quick turn on entry, then one complete eased revolution while it shrinks, then a calm idle turn
  const ang = 0.35 * t + 1.3 * (1 - Math.exp(-3 * t)) + Math.PI * 2 * easeInOutCubic(seg(t, 1.0, 2.75));
  planet.rotation.y = -2.2 + ang;
  moonPivot.rotation.y = ang * 1.6;
  renderer.setSize(W, H, false);
  renderer.render(scene, cam);

  // 4) words: sizes and arcs scale with the final globe; positions follow the globe as it lands
  const px = H / 2; // px per unit
  const gcx = W / 2 + x * px, gcy = H / 2 - y * px, gr = r * px;
  const wordsIn = seg(t, 2.05, 3.5);
  const topSize = END.r * kf * px * 0.62, botSize = END.r * kf * px * 0.42;
  const stagger = (i, n, start, step) => {
    const lt = t - start - i * step;
    const s = spring(clamp(lt / 0.9, 0, 2));
    return { pos: s, scale: 0.6 + 0.4 * clamp(s, 0, 1.2), op: clamp(lt / 0.12) };
  };
  // KALEYDO: a gentle arch whose baseline dips into the globe's top edge; drops in from above
  layout(TOP, topSize, 48, gcx, gcy - gr * 0.84, 1, 0.02, (i) => stagger(i, TOP.length, 2.1, 0.065), topSize * 1.4);
  // WORLD: a gentle smile whose letters cover the globe's bottom edge; rises in from below
  layout(BOT, botSize, 40, gcx, gcy + gr * 0.9 + botSize * 0.72, -1, 0.14, (i) => stagger(i, BOT.length, 2.5, 0.07), botSize * 1.6);
  svg.style.visibility = wordsIn > 0 ? 'visible' : 'hidden';
}

// ---------------------------------------------------------------- controls
const scrub = document.getElementById('scrub'), tv = document.getElementById('tv'), speedSel = document.getElementById('speed');
let t = 0, playing = true, last = performance.now();
document.getElementById('play').onclick = () => { t = 0; playing = true; };
scrub.oninput = () => { t = +scrub.value; playing = false; };
addEventListener('keydown', (e) => { if (e.code === 'Space') { playing = !playing; if (t >= DUR) t = 0; } });
await document.fonts.load('700 100px Fredoka');
function loop(now) {
  const dt = (now - last) / 1000;
  last = now;
  if (playing) t = Math.min(DUR + 20, t + dt * +speedSel.value);
  scrub.value = Math.min(DUR, t);
  tv.textContent = t.toFixed(2) + 's';
  frame(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// for scripted checks (a hidden tab gets no animation frames)
window.__frame = (tt) => { t = tt; playing = false; frame(tt); };
</script>
</body>
</html>
